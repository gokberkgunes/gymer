# Static analysis for Gymer: the Flutter recommended lints plus stricter typing and async checks.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # No implicit casts from dynamic (JSON) and no raw generic types: a malformed value fails where it is read.
    strict-casts: true
    strict-raw-types: true
    strict-inference: true

linter:
  rules:
    # A Future that is neither awaited nor marked unawaited() is usually a forgotten await.
    - unawaited_futures
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_final_in_for_each
    - only_throw_errors
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types
    - avoid_void_async
    - test_types_in_equals
    - unnecessary_await_in_return
