[project]
name = "gymer"
version = "0.1.0"
description = "simple workout tracker"
requires-python = ">=3.10"
dependencies = [
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "flet==0.86.5",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "msgpack==1.1.2",
    "oauthlib==3.3.1",
    "repath==0.9.0",
    "six==1.17.0",
]

[tool.flet]
product = "GYMER"
bundle_id = "com.flet.gymer"
build_number = 1

[tool.flet.app]
path = "src"
module = "main"
exclude = ["storage", ".flet", "__pycache__", ".venv"]

[tool.flet.template]
ref = "0.86.5"

[tool.flet.android]
target_arch = ["arm64-v8a", "x86_64"]
split_per_abi = false
